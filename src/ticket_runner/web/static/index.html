<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ticket-runner</title>
<link rel="icon" type="image/svg+xml" href="/static/assets/console.svg">
<script>
  /* Before the first paint, or the console flashes white on the way to dark.
     Dark is the default because the console it replaces had no other. */
  try {
    var kept = localStorage.getItem("ticket-runner-theme");
    document.documentElement.classList.toggle("dark", kept !== "light");
  } catch (error) { /* a browser with storage switched off still gets dark */ }
</script>
  <script type="module" crossorigin src="/static/assets/console.js"></script>
  <link rel="modulepreload" crossorigin href="/static/assets/rolldown-runtime.js">
  <link rel="modulepreload" crossorigin href="/static/assets/react.js">
  <link rel="modulepreload" crossorigin href="/static/assets/ui.js">
  <link rel="modulepreload" crossorigin href="/static/assets/useCompositeItem.js">
  <link rel="stylesheet" crossorigin href="/static/assets/console.css">
</head>
<body>
<div id="root"></div>
</body>
</html>
